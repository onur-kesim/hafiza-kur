# .github/workflows/capraz.yml
#
# FAZ 0 — ÖLÇ, DÜZELTME.
# Bu iş akışı hiçbir şeyi düzeltmez; yalnız "hangi platformda ne kırılıyor"u ÖLÇER.
# Bu yüzden ÖLÇÜM adımları `continue-on-error: true` ile koşar: amaç yeşil almak
# değil, KIRMIZI LİSTEYİ ÜRETMEK. Liste çıktıktan sonra bu bayrak kaldırılır.
#
# FAZ A-0 (Y-2) SONRASI TEK İSTİSNA — "HUKUM KAPISI":
#   Ölçüm adımı yumuşak kalır, ama HÜKMÜN VARLIĞI pazarlık konusu değildir.
#   Ölçüldü (CI run #2): windows py3.11 ve py3.13'te t_y42 58 senaryonun
#   TAMAMINI koştu (91 sn / 110 sn) ve rapor döngüsünün İLK satırında
#   UnicodeEncodeError ile çöktü; 58 hükmün tamamı basılmadan kayboldu.
#   `continue-on-error` bunu yuttu, iş YEŞİL göründü — hatta API'de adımın
#   `conclusion` alanı bile "success" döndü (gerçek sonuç `outcome`ta saklanır).
#   Yani çapraz ölçümün 1/3'ü KÖRDÜ ve bu körlük YEŞİL TİK olarak raporlanıyordu.
#   Bu yüzden her `kanit` işi artık çıktısını hukum.log'a da yazar ve sonda
#   `continue-on-error` OLMAYAN bir kapı, beklenen hüküm satırlarının BASILDIĞINI
#   ölçer. Hüküm kaybolursa iş KIRMIZI olur. Kapı hükümlerin YEŞİL olduğunu
#   söylemez — sadece KAYBOLMADIĞINI.
#
# Public repo'da GitHub-hosted runner'lar (ubuntu/windows/macos) ücretsiz ve
# dakika limitsizdir. Private repo'da çarpanlar: Windows 2x, macOS 10x.

name: capraz-olcum

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # 1) ÜÇ PLATFORM × İKİ PYTHON — kanıt koşucuları
  # ---------------------------------------------------------------------------
  kanit:
    name: kanit ${{ matrix.os }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false          # bir platform düşse de ötekiler ölçülsün
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: ortam kimligi
        shell: bash
        run: |
          python -c "import sys,platform,os,sqlite3;print('py',sys.version);print('platform',platform.platform());print('fs-encoding',sys.getfilesystemencoding());print('default-encoding',__import__('locale').getpreferredencoding(False));print('sqlite',sqlite3.sqlite_version)"

      - name: SHA256 dogrulamasi
        shell: bash
        run: python -c "import hashlib;print(hashlib.sha256(open('skill/scripts/hafiza.py','rb').read()).hexdigest().upper())"

      # Her olcum adimi ciktisini ../../hukum.log'a da yazar; sondaki HUKUM KAPISI
      # o logda hukum satirlarini arar. `tee` kullanilmasi bilincli: adimin kendi
      # ciktisi Actions arayuzunde gorunmeye devam etsin.

      - name: t_y3 — temiz hata kanitlari (20 senaryo)
        continue-on-error: true
        shell: bash
        working-directory: skill/scripts
        run: python t_y3.py 2>&1 | tee -a ../../hukum.log

      - name: isir — taze projede mutant kaniti
        continue-on-error: true
        shell: bash
        working-directory: skill/scripts
        run: |
          {
            mkdir -p deneme && git init -q deneme
            python hafiza.py kur  --kok=deneme --ad "CI"
            python hafiza.py kapi --kok=deneme || echo "kapi exit=$?"
            python hafiza.py isir --kok=deneme || echo "isir exit=$?"
          } 2>&1 | tee -a ../../hukum.log

      - name: isir — derle sonrasi TAM kosum
        continue-on-error: true
        shell: bash
        working-directory: skill/scripts
        run: |
          {
            python hafiza.py not   --kok=deneme --konu=genel-durum --metin="ci ilk not"
            python hafiza.py derle --kok=deneme
            python hafiza.py isir  --kok=deneme || echo "isir exit=$?"
          } 2>&1 | tee -a ../../hukum.log

      # SURE: "~13 dk" beyani YANLISTI ve run #2'de olculdu — asagidaki gercek
      # duvar saati degerleri o kosumdandir (yerel Linux'ta da 60 sn):
      #   ubuntu 64/73 sn - macos 53/46 sn - windows 91/110 sn (windows'ta COKTU)
      # Belgedeki her sayi gibi bu da BAGLAMLIDIR: GitHub-hosted runner, soguk
      # calisma alani. Onur'un kendi Windows'unda daha uzun surmesi beklenir;
      # o sure OLCULMEDI, buraya yazilmaz.
      - name: t_y42 — davranis kanitlari (58 senaryo, ~1-2 dk runner'da)
        continue-on-error: true
        shell: bash
        working-directory: skill/scripts
        run: python t_y42.py 2>&1 | tee -a ../../hukum.log

      # NOT: B-6 (300k satirda kapi < 8 sn) CI runner'inda buyuk olasilikla KALDI der.
      # Bu bir KOD kusuru degil, TEST kusurudur (kalibrasyonsuz mutlak duvar saati).
      # Fable 4. tur, §3.6. Faz F'de referans-ise gore kalibre edilecek.

      # ---- HUKUM KAPISI — continue-on-error YOK. Hukum kaybolursa is KIRMIZI. ----
      - name: HUKUM KAPISI — kosucular hukmunu BASTI mi?
        if: always()
        shell: bash
        run: python faz0/hukum_kapisi.py hukum.log

      - name: kirik liste artefakti
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanit-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            hukum.log
            skill/scripts/hafiza_hata_izi.txt
            skill/scripts/deneme/**
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 2) WINDOWS PROBU — Y-1 hipotezi: os.kill(pid, 0) olcmez mi, ates mi eder?
  #     bpo-14480 CLOSED-REJECTED: "0 has no special meaning on Windows"
  #     Bu is bunu OLCER. Tek amaci bu.
  # ---------------------------------------------------------------------------
  win_kill_probu:
    name: Y-1 probu (windows)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: os.kill(pid, 0) davranisi
        continue-on-error: true
        shell: bash
        run: python faz0/win_kill_probu.py

  # ---------------------------------------------------------------------------
  # 2b) Y-2 MUTANTI — Faz A-0'da eklenen cikti-kodlamasi korumasi ISIRIYOR mu?
  #     "Olculmeyen kapinin hukmu YOKTUR" (doktrin 1). Koruma eklemek yetmez;
  #     sokuldugunde kosucunun COKTUGU gosterilmelidir.
  #     Bu is `continue-on-error` KULLANMAZ: mutant kacarsa koruma kordur ve
  #     bunun kirmizi gorunmesi gerekir.
  # ---------------------------------------------------------------------------
  y2_mutant:
    name: Y-2 mutanti (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: koruma sokulunce kosucu cokuyor mu?
        shell: bash
        run: python faz0/y2_mutant.py

  # ---------------------------------------------------------------------------
  # 2b-2) Y-4 MUTANTI — OLCUM ARACI, OLCEMEDIGINI "KACTI" DIYE RAPORLUYOR MU?
  #     Olculdu (Faz A, bulut Linux): salt-okunur kaynak agacinda y2_mutant ham
  #     PermissionError basip exit 1 verdi. Sozlesmede 1 = "MUTANT KACTI".
  #     Yani OLCULEMEYEN hal, GERCEK KIRMIZIDAN ayirt edilemez bicimde
  #     raporlaniyordu. Sahte kirmizi, gercek kirmiziyi degersizlestirir.
  #     `continue-on-error` YOK: olcum aracinin hukum sozlesmesi bir kapidir.
  # ---------------------------------------------------------------------------
  y4_mutant:
    name: Y-4 mutanti / olcum araci sozlesmesi (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: y2_mutant olcemedigini ARAC KUSURU diye mi raporluyor?
        shell: bash
        run: python faz0/y4_mutant.py

  # ---------------------------------------------------------------------------
  # 2b-3) FAZ A SENARYOLARI — B4-5 / B4-6 / B4-10 / B4-11 duzeltmeleri ISIRIYOR MU?
  #     Her duzeltmeye AYRI senaryo, her senaryoya AYRI sabotaj: duzeltme
  #     sokulunce ESKI kusur yeniden URETILMELI. Uretemiyorsa senaryo komsu bir
  #     sinifi olcuyordur ve hukmu yoktur.
  #     Windows notu: B4-5 kolu salt-okunur dizinle cokme uretir; uretemezse
  #     senaryo kendini OLCULEMEDI ilan eder (exit 2) — sessiz PASS vermez.
  #     `continue-on-error` YOK.
  # ---------------------------------------------------------------------------
  fazA_senaryolari:
    name: Faz A senaryolari (${{ matrix.os }} py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: duzeltmeler isiriyor mu (sabotajla sinanmis)
        shell: bash
        run: python faz0/fazA_senaryolari.py

  # ---------------------------------------------------------------------------
  # 2b-4) FAZ B SENARYOLARI — yaz() atomiklestirmesi ISIRIYOR MU?
  #     Kapsam kararlari: yalniz yaz() · salt-okunur hedefte REDDET (izin ASILMAZ)
  #     · fsync(dosya)+os.replace · hedefin izin bitleri kopyalanir · hardlink
  #     BAG KOPAR ve UYARI METNI bunu soyler.
  #     Cokme IZIN MODELIYLE DEGIL ENJEKSIYONLA uretilir (fazA'nin #7 dersi:
  #     os.chmod Windows'ta dizinlerde etkisizdir, izinle cokme ureten senaryo
  #     ARACI degil ORTAMI olcer).
  #     B-B2 IKIYE BOLUNDU (CI #12 artefakti okununca gorulen OLCUT kusuru):
  #     B-B2a "izin ASILMIYOR" (olcut: dosya degisti mi) Windows'ta UYGULANMAZ,
  #     B-B2b "TESHIS SINIFI kapiya ait" (olcut: sabotaj kolunda SALT-OKUNUR
  #     teshisi kayboluyor mu) HER platformda olculur. Her hukum artik iki kolun
  #     SABOTAJ IZINI (exit + teshis sinifi) basar; izsiz hukum ARAC KUSURUDUR.
  #     Platforma bagli kollar kendini OLCULEMEDI/UYGULANMAZ ilan eder, sessiz
  #     PASS vermez: B-B2a/b root'ta (os.access 0444'te True doner) · B-B3
  #     Windows'ta (POSIX mod bitleri yok).
  #     `continue-on-error` YOK.
  # ---------------------------------------------------------------------------
  fazB_senaryolari:
    name: Faz B senaryolari (${{ matrix.os }} py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: atomik yazim isiriyor mu (sabotajla sinanmis)
        shell: bash
        run: python faz0/fazB_senaryolari.py 2>&1 | tee fazB-cikti.txt
      # Actions API bulut konteynerinden 403 veriyor ve HTML is listesi GUVENILMEZ
      # (run #7 ve #9'da iki kez yanlis okundu). Ciktinin INDIRILEBILIR olmasi,
      # teshisi tahminden OLCUME ceviren tek yol.
      - name: fazB ciktisi (artefakt)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fazB-${{ matrix.os }}-py${{ matrix.python }}
          path: fazB-cikti.txt
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 2b-5) FAZ B OLCUT MUTANTI — §5'in kendisi ISIRIYOR MU?
  #     Bir OLCUT duzeltmesi de bir kapidir: "olculmeyen kapinin hukmu YOKTUR".
  #     Bu is B-B2 bolunmesinin katkisini olcer. Katki YALNIZ os.replace'in
  #     salt-okunur hedefi reddettigi ortamda gorunur, bu yuzden mutant O ORTAMI
  #     ENJEKSIYONLA URETIR ve ayni kosumda ESKI olcutu de kosar:
  #         YENI olcut -> ISIRDI      ESKI olcut -> UYGULANMAZ
  #     Ikisi ayni hukmu verirse duzeltme KORDUR ve mutant KACTI der.
  #     Uretilen ortam GERCEK WINDOWS DEGILDIR; Windows'un kendi hukmunu yukaridaki
  #     fazB_senaryolari isi olcer. Bu is onun YERINE GECMEZ.
  #     `continue-on-error` YOK.
  # ---------------------------------------------------------------------------
  fazB_olcut_mutanti:
    name: Faz B olcut mutanti (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: olcut duzeltmesi isiriyor mu (sabotajla sinanmis)
        shell: bash
        run: python faz0/fazB_olcut_mutanti.py 2>&1 | tee fazB-olcut-cikti.txt
      - name: olcut mutanti ciktisi (artefakt)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fazB-olcut-${{ matrix.os }}
          path: fazB-olcut-cikti.txt
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 2b-6) ALTIN CIKTI — kapi ciktisi SESSIZCE degisti mi?
  #     Faz C `_kapi_govde`'yi kapi basina saf fonksiyonlara boluyor. Bir
  #     refactoring'in tek vaadi DAVRANISIN AYNI KALMASIDIR; mevcut kosucular ise
  #     hukum/exit seviyesinde olcer ve bir kapinin NOTUNUN sessizce kaybolmasini
  #     GORMEZ. Bu is o boslugu kapatir: 5 proje hali x 2 komut = 10 olcum,
  #     BIT-BIT karsilastirma.
  #     Arac ONCE KENDINI KANITLAR (`--kendini-sina`): motora kasitli bir NOT
  #     degisikligi enjekte edilir ve aracin FARK demesi beklenir. Demezse arac
  #     kordur ve is KIRMIZI olur — normallestirme fazla agresiflesirse bunu
  #     yakalayan tek kapi budur.
  #     🔴 `--kendini-sina` YESILI, `--karsilastir` KIRMIZISI HAKKINDA HUKUM VERMEZ.
  #     Ikisi AYRI eksen olcer: kendini-sina iki KOSUM-ANI kolunu karsilastirir
  #     (ortama sistematik fark iki kolda da bulunup birbirini goturur), karsilastir
  #     ise kosum-anini SAKLANMIS artefaktla kiyaslar. Olculdu (11 Agu 2026): temiz ·
  #     CRLF · \x0b ortamlarinin ucunde de kendini-sina "10 fark · ISIRDI · exit 0".
  #     CIKIS KODU SOZLESMESI: 0 fark yok · 1 FARK VAR (urun hukmu) · 2 OLCULEMEDI
  #     (fark VAR ama SATIR duzeyinde adlandirilamiyor -> satir siniri karakteri sinifi
  #     basilir; bu bir URUN regresyonu DEGIL, once ARAC/ORTAM ayrilir) · 3 ARAC KUSURU
  #     (referansin SEKLI bozuk: eksik alan / yanlis tur — ham traceback ile exit 1
  #     DEGIL). 2 ve 3 de isi KIRMIZI yakar; ayrim HUKMUN kendisindedir.
  #     run #17/#18 tam bu ayrimin yoklugunda yanlis okundu: arac 10 adlandirilamayan
  #     farki "davranis DEGISTI" (exit 1) diye raporladi. Asagidaki olcut mutanti
  #     bu ayrimin ISIRDIGINI olcer.
  #     KUME KAPSAMI (11 Agu 2026'da genisletildi): 11 proje hali x 2 komut =
  #     22 olcum. Cikis kodu dagilimi 0:10 · 1:6 · 3:6 — YESIL, HATA ve KESILME
  #     yollarinin UCU DE kilitli. Onceki kume 10/10 exit 0'di ve Faz C'nin
  #     kismi-cikti kusurunu GORMESI MUMKUN DEGILDI.
  #     `continue-on-error` YOK.
  # ---------------------------------------------------------------------------
  altin_cikti:
    name: Altin cikti / kapi esdegerligi (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: arac once KENDINI kanitliyor mu
        shell: bash
        run: python faz0/altin_cikti.py --kendini-sina 2>&1 | tee altin-sina.txt
      - name: kapi ciktisi altin kumeyle AYNI mi
        shell: bash
        run: python faz0/altin_cikti.py --karsilastir faz0/altin_kapi.json 2>&1 | tee altin-fark.txt
      - name: altin cikti artefakti
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: altin-${{ matrix.os }}
          path: |
            altin-sina.txt
            altin-fark.txt
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 2b-7) FAZ C BOLME MUTANTI — esdegerlik kapisi BOLMEYE OZGU kusurlari goruyor mu?
  #     Faz C `_kapi_govde`'yi 16 kapi fonksiyonuna boldu. "FARK YOK" demek yeterli
  #     degil: kapinin bu bolmeye ozgu kusurlari (kapi sirasi, bolumler arasi uc
  #     kenar, kapi-ici kesilmede BULGU KAYBI, kapi dusurme) GORDUGU kanitlanmali.
  #     Bu dosya kendi proje hallerini kurar, referansi kosum aninda temiz motordan
  #     alir ve alti kusuru tek tek enjekte eder. Alti kusurun ALTISI da isirmalidir.
  #     Teslim gunune kadar bu is CI'DA YOKTU: alti mutant tek makine, tek platformda
  #     olculmustu. `continue-on-error` YOK.
  # ---------------------------------------------------------------------------
  fazC_bolme_mutanti:
    name: Faz C bolme mutanti (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: bolmeye ozgu kusurlar OLCULUYOR mu
        shell: bash
        run: python faz0/fazC_bolme_mutanti.py 2>&1 | tee fazC-mutant-cikti.txt
      - name: fazC mutanti ciktisi (artefakt)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fazC-mutant-${{ matrix.os }}
          path: fazC-mutant-cikti.txt
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 2b-8) ALTIN OLCUT MUTANTI — altin_cikti.py'nin UC duzeltmesi ISIRIYOR MU?
  #     run #17/#18'de altin_cikti windows kolunda kirmizi yandi ve artefakt sunu
  #     gosterdi: 10 olcumde CIKTI DEGISTI · hicbirinde EXIT DEGISTI YOK · hepsinde
  #     "(satir farki bulunamadi)" · hukum "davranis DEGISTI" (exit 1). Yani arac bir
  #     fark GORDU, ADLANDIRAMADI, ve buna ragmen URUN'u sucladi — Y-4 sinifi.
  #     DUZELTME-1 kos(): `-X utf8` + text=True/encoding/errors (universal newline).
  #                 Kodlama ACIK verilir: `LC_ALL=C PYTHONUTF8=0` altinda ciplak
  #                 `text=True` UnicodeDecodeError + exit 1 verir (olculdu 11 Agu 2026).
  #     DUZELTME-2 adlandirilamayan fark -> OLCULEMEDI (exit 2) + SATIR SINIRI
  #                 karakterinin SINIFI ve repr penceresi. Tabloda yalniz satir siniri
  #                 karakterleri vardir; NBSP/BOM/SEKME satir listesini degistirir,
  #                 adlandirilabilir fark uretir ve teshise HIC ULASMAZ.
  #     DUZELTME-3 referansin SEKLI kapida sinanir -> ARAC KUSURU (exit 3), ham
  #                 traceback + exit 1 DEGIL. (Bagimsiz denetci teslimden once buldu.)
  #     Bir OLCUT duzeltmesi de bir kapidir. Bu is ORTAMI ENJEKSIYONLA URETIR (cocugun
  #     satir sonu kipi; iki karakter: \x0b ve \x85) ve ayni kosumda ESKI olcutu de
  #     kosar. YEDI mutant, her biri AYRI bir korumayi olcer. Uretilen ortam GERCEK
  #     WINDOWS DEGILDIR; Windows'un kendi hukmunu yukaridaki altin_cikti isi olcer.
  #     Bu is onun YERINE GECMEZ. `continue-on-error` YOK.
  # ---------------------------------------------------------------------------
  altin_olcut_mutanti:
    name: Altin olcut mutanti (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: olcut duzeltmeleri isiriyor mu (yedi mutant)
        shell: bash
        run: python faz0/altin_olcut_mutanti.py 2>&1 | tee altin-olcut-cikti.txt
      - name: altin olcut mutanti ciktisi (artefakt)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: altin-olcut-${{ matrix.os }}
          path: altin-olcut-cikti.txt
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 2b-9) ALTIN KUME GENISLEMESI MUTANTI — HATA ve KESILME kayitlari ISIRIYOR MU?
  #     Faz C'nin kanla olculen dersi: altin kumenin 10 olcumunun 10'u exit 0'di,
  #     yani kanit YALNIZ YESIL YOLU kapsiyordu. Bir kapi yarida kesilince o ana
  #     kadarki bulgu KAYBOLUYORDU (FAIL(2)/exit 1 -> FAIL(1)/exit 3) ve UC
  #     ESDEGERLIK AYAGI DA BUNU GORMEDI.
  #     Kume alti hal ile genisletildi (11 hal x 2 komut = 22 olcum; cikis kodu
  #     dagilimi 0:10 · 1:6 · 3:6). Referans BOLME ONCESI motordan (a1fc24bb…)
  #     kaydedildi, boylece Faz C bolmesi hata ve kesilme yollarinda GERIYE DONUK
  #     sinaniyor — ozgun kume bunu yapamiyordu. Olculdu: FARK YOK.
  #     Bu is genislemenin ISIRDIGINI yaristirarak olcer:
  #         ESKI kapsam (5 yesil hal) -> kusur enjekte edilince de FARK YOK (KOR)
  #         YENI kapsam (11 hal)      -> FARK VAR + EXIT DEGISTI 1 -> 3   (ISIRDI)
  #     Ikisi ayni hukmu verirse genisleme KORDUR ve mutant KACTI der.
  #     KAPSAM DISI (olculdu): exit 2 (stderr yazilamiyor) ve exit 130 (SIGINT)
  #     proje halinden platformdan bagimsiz uretilemiyor; kumede YOKTUR.
  #     `continue-on-error` YOK.
  # ---------------------------------------------------------------------------
  altin_kapi_mutanti:
    name: Altin kume genislemesi mutanti (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: hata ve kesilme kayitlari isiriyor mu (alti mutant)
        shell: bash
        run: python faz0/altin_kapi_mutanti.py 2>&1 | tee altin-kume-cikti.txt
      - name: altin kume mutanti ciktisi (artefakt)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: altin-kume-${{ matrix.os }}
          path: altin-kume-cikti.txt
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 2b-10) H1 KENAR MUTANTI — `_kapi_h1`in bes parcasi arasindaki kenarlar OLCULUYOR mu?
  #     12 Agu 2026: `_kapi_h1` bes parcaya bolundu (CC 54 -> 2) ve kabul olcutu
  #     olarak altin kume BIT-BIT tuttu. Ama o olcut "bugunku kod ayni davraniyor"
  #     der; "bir kenar yarin sessizce koparsa BIR OLCUM KIRMIZI OLUR" DEMEZ.
  #
  #     🔴 OLCULDU VE BOSLUK GERCEK CIKTI: yedi mutantin UCUNE altin kume KOR.
  #         M-H1c KENAR snapL   (BEYAN -> KOVA)          altin kume: FARK YOK
  #         M-H1e SAFLIK KENARI (`_h1_kova_bek` donusu)  altin kume: FARK YOK
  #         M-H1f KORUMA SOKME  (snapshot korumasi)      altin kume: FARK YOK
  #     En agiri sonuncusudur: bolmenin GOVDESI uretecle birebir tasindi, elle
  #     yazilan TEK mantik o koruma satiriydi — ve o satir tamamen silindiginde
  #     `--karsilastir` hala "FARK YOK, 22 olcum bit-bit" diyor (elle dogrulandi).
  #     Sebep: altin kumenin 11 halinin hicbirinde `_KAYNAK.md` eksik degil, yani
  #     koruma o kumede hic ateslenmiyor. Bu, FAZ C'de `bl`/`ks` icin olculen
  #     sinifin AYNISIDIR: kod dogru ama KANITSIZ.
  #
  #     BU IS IKI SUTUN BASAR ve ikincisi bilerek CI'dadir:
  #         KENDI KUMESI : 5 proje hali x 2 komut = 10 olcum, 7 mutant isirmali
  #         ALTIN KUME   : ayni sabotaji altin karsilastirma goruyor mu
  #     Ikinci sutun bir SURUKLENME OLCERIDIR: altin kumeye hal eklenirse KOR sayisi
  #     dusmeli, kapsam daralirsa yukselmeli. Sabit bir sayi degil, izlenen bir sayi.
  #     Maliyeti olculdu (bulut Linux, 2 CPU): tam kosum 45 sn — CI'da zaten olan
  #     fazC_bolme_mutanti 31 sn. Kisaltmaya (--altin-atla) gerek YOK.
  #
  #     KARAR (12 Agu 2026, Onur): altin kumeye hal EKLENMEDI. Kumenin tek degeri
  #     BOLME ONCESI motora (a1fc24bb…) bagli olmasidir; bugunku motordan yeniden
  #     kaydedilse o bag kopar ve bir daha kurulamaz. Kenar kapsami bu isten gelir.
  #     Gerekce defteri: faz0/H1_KENAR_RAPORU.md §5.
  #
  #     WINDOWS/macOS NOTU: bu mutant BU IS EKLENENE KADAR yalniz bulut Linux'ta
  #     kostu. Duzenek hal agacini `shutil.copytree` ile kollara kopyalar (git ile
  #     baslatilmis dizinler dahil); Windows'ta dosya kilidi davranisi OLCULMEDI.
  #     Kurulum coker ise arac `Kurulamadi` -> OLCULEMEDI -> exit 2 verir, sessiz
  #     PASS DEGIL (Y-4 dersi). exit 2 de isi kirmizi yakar; bu DOGRUDUR.
  #     `continue-on-error` YOK.
  # ---------------------------------------------------------------------------
  h1_kenar_mutanti:
    name: H1 kenar mutanti (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: bes parca arasi kenarlar OLCULUYOR mu (yedi mutant + altin sutunu)
        shell: bash
        run: python faz0/h1_bolme_mutanti.py 2>&1 | tee h1-kenar-cikti.txt
      - name: h1 kenar mutanti ciktisi (artefakt)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h1-kenar-${{ matrix.os }}
          path: h1-kenar-cikti.txt
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 2b-11) H14 KENAR MUTANTI — `_kapi_h14`un dort parcasi arasindaki kenarlar
  #     OLCULUYOR mu?
  #     13 Agu 2026: `_kapi_h14` dort parcaya bolundu (CC 35 -> 3, 104 satir -> 12)
  #     ve altin kume 22 olcumde BIT-BIT tuttu. H1 turunun dersi burada da gecerli:
  #     "FARK YOK" bugunku davranisi kanitlar, kenarin OLCULDUGUNU degil.
  #
  #     🔴 OLCULDU — BOSLUK H1'DEKINDEN BUYUK CIKTI: yedi mutantin BESINE altin
  #     kume KOR (H1'de yedide uctu).
  #         M-H14a KENAR git_var    altin kume: FARK YOK
  #         M-H14b KENAR kirli      altin kume: FARK YOK
  #         M-H14c KENAR izlenen    altin kume: FARK YOK
  #         M-H14f TOLERANS         altin kume: FARK YOK
  #         M-H14g KORUMA SOKME     altin kume: FARK YOK
  #     Sebep yapisaldir: H14 PROJE ZAMANI ile HAFIZA ZAMANI arasindaki farki
  #     olcer; altin kumenin halleri taze kurulmus, hafizasi bugun yazilmis
  #     projelerdir, yani orada H14 hep ayni tek cumleyi uretir. Git'in dort
  #     sinifi (izlenen-temiz · izlenen-kirli · izlenmeyen · .gitignore'lu) o
  #     kumede HIC ayrismaz — oysa H14'un git mantiginin var olus nedeni odur.
  #
  #     BU IS IKI SUTUN BASAR (h1_kenar_mutanti ile ayni sozlesme):
  #         KENDI KUMESI : 7 proje hali x 1 komut = 7 olcum, 7 mutant isirmali
  #         ALTIN KUME   : ayni sabotaji altin karsilastirma goruyor mu (surukleme olceri)
  #
  #     HAL KAPISI (bu betige ozgu): temiz kolda her halin ciktisinda bir H14
  #     satiri BULUNMALIDIR. Bulunmazsa hal H14'u hic atesliyor demektir ve butun
  #     mutantlar sahte "temiz" gorunurdu; betik o durumda OLCULEMEDI der (exit 2).
  #
  #     WINDOWS/macOS NOTU: haller `git commit` ve `os.utime` ile kurulur (izlenen-
  #     temiz sinifi ancak gercek bir commit tarihiyle var olur). Windows'ta dosya
  #     kilidi / mtime cozunurlugu OLCULMEDI; bu is tam da onu olcmek icin var.
  #     Kurulum coker ise `Kurulamadi` -> OLCULEMEDI -> exit 2, sessiz PASS DEGIL.
  #     `continue-on-error` YOK.
  # ---------------------------------------------------------------------------
  h14_kenar_mutanti:
    name: H14 kenar mutanti (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: dort parca arasi kenarlar OLCULUYOR mu (yedi mutant + altin sutunu)
        shell: bash
        run: python faz0/h14_bolme_mutanti.py 2>&1 | tee h14-kenar-cikti.txt
      - name: h14 kenar mutanti ciktisi (artefakt)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h14-kenar-${{ matrix.os }}
          path: h14-kenar-cikti.txt
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 2b-12) KARMASIKLIK OLCUTU — CC sayisini uretenin KENDISI isiriyor mu?
  #     13 Agu 2026'da olculdu: eski CC sayilari YANLISTI (comprehension `if`leri
  #     sayilmiyor, `with` sayiliyordu). Bir OLCUT de bir kapidir; olculmezse
  #     hukmu yoktur. `karmasiklik_mutanti.py` olcutun 9 kusurunu enjekte eder,
  #     dokuzu da isirmalidir. `continue-on-error` YOK.
  #
  #     🔴 ARAC `--kapi` ILE KOSULMAZ: motorda bugun 14 ihlal var (11 CC>20,
  #     11 satir>80, birlesik 14) ve bunlar Faz C'nin ACIK IS listesidir, bir
  #     regresyon degil. `--kapi` bu isi her kosumda kirmizi yakardi ve KIRMIZI
  #     DEGERSIZLESIRDI. Arac burada RAPOR kipinde kosar (exit 0) ve ciktisi
  #     artefakt olarak saklanir; ihlal listesi boylece kosumdan kosuma
  #     KARSILASTIRILABILIR olur. Kapi kipine gecis, liste bosaldiginda ayri bir
  #     kararla yapilir.
  # ---------------------------------------------------------------------------
  karmasiklik:
    name: karmasiklik olcutu (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: olcutun kendisi isiriyor mu (dokuz mutant)
        shell: bash
        run: python faz0/karmasiklik_mutanti.py 2>&1 | tee karmasiklik-mutant.txt
      - name: motorun ihlal listesi (RAPOR kipi — kapi DEGIL)
        shell: bash
        run: python faz0/karmasiklik.py skill/scripts/hafiza.py --ihlal 2>&1 | tee karmasiklik-ihlal.txt
      - name: karmasiklik ciktilari (artefakt)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karmasiklik-${{ matrix.os }}
          path: |
            karmasiklik-mutant.txt
            karmasiklik-ihlal.txt
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 2b-13) H4 KENAR MUTANTI — `_kapi_h4`un dort parcasi arasindaki kenarlar
  #     OLCULUYOR mu?  (kalip: h1 -> h14 -> h4; artik sabit)
  #     13 Agu 2026: `_kapi_h4` dorde bolundu (CC 32 -> 4, 61 satir -> 10).
  #     H4'un altin kumedeki gorunurlugu H14'ten de dusuktur: altin kumenin
  #     hallerinde canli hafizada backtick'li YOL BEYANI yoktur, dolayisiyla H4
  #     orada cogunlukla HIC KONUSMAZ. Konusmayan kapinin kenari "FARK YOK" ile
  #     kanitlanamaz — bu is o boslugu kapatir.
  #     Yedi hal: olu · tasinmis · ayni-ad-baska-yol · 12'li kirpma · 7'li tasinmis
  #     kirpma · markdown bicimi · TURKCE adli olu baglanti (Fable Bulgu 4 dali).
  #     `continue-on-error` YOK.
  # ---------------------------------------------------------------------------
  h4_kenar_mutanti:
    name: H4 kenar mutanti (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: dort parca arasi kenarlar OLCULUYOR mu (alti mutant + altin sutunu)
        shell: bash
        run: python faz0/h4_bolme_mutanti.py 2>&1 | tee h4-kenar-cikti.txt
      - name: h4 kenar mutanti ciktisi (artefakt)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h4-kenar-${{ matrix.os }}
          path: h4-kenar-cikti.txt
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 2b-15) H10 KENAR MUTANTI — kenarlar VE HUKUM KANALLARI olculuyor mu?
  #     13 Agu 2026: `_kapi_h10` dorde bolundu (CC 27 -> 1, 81 satir -> 8).
  #     🔴 H10 ONCEKILERDEN FARKLI: h14/h4'te tasinan bolgeler hukum BASMIYORDU
  #     (bos bolge kapisi "sifir mi" diye soruyordu). H10'da dort bolgenin DORDU de
  #     basar. Bu yuzden uretecteki kapi genellestirildi — KANAL KAPISI: bir bolge
  #     hangi hukum kanalini kullaniyorsa (fail/F · N · O), parcanin IMZASI onu
  #     TASIMAK ZORUNDA; tasimazsa uretec dosyayi YAZMAZ. Mutant da bunu olcer:
  #     F ya da O yerine bos liste verildiginde bulgu sessizce kayboluyor mu.
  #
  #     🔴 ESDEGER MUTANT KAYDI: ilk SIRA mutanti (`_h10_yapi` ile `N.append` yer
  #     degistirir) KACTI. Sebep korluk DEGIL, esdegerlikti: bulgular ve notlar
  #     AYRI BOLUMLERDE basilir, sira yalniz AYNI KANAL icinde gozlenebilir.
  #     Esdeger mutanti "kacti" diye raporlamak SAHTE KIRMIZI olurdu (Y-4 dersi);
  #     mutant ayni kanala yazan iki parcaya tasindi ve kumeye `h_cift_cit` hali
  #     eklendi. Dokuz hal x alti mutant.
  #     `continue-on-error` YOK.
  # ---------------------------------------------------------------------------
  h10_kenar_mutanti:
    name: H10 kenar mutanti (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: kenarlar ve hukum kanallari OLCULUYOR mu (alti mutant + altin sutunu)
        shell: bash
        run: python faz0/h10_bolme_mutanti.py 2>&1 | tee h10-kenar-cikti.txt
      - name: h10 kenar mutanti ciktisi (artefakt)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h10-kenar-${{ matrix.os }}
          path: h10-kenar-cikti.txt
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 2b-16) H12 KENAR MUTANTI — kenarlar VE UC HUKUM KANALI olculuyor mu?
  #     14 Agu 2026: `_kapi_h12` uce bolundu (CC 25 -> 1, 46 satir -> 6).
  #     Bu bolmede kalibin IKI UCU birden gorunur:
  #       `_h12_tazelik`        UC kanali birden kullanir (F·N·O) -> ucunu de ALIR
  #       `_h12_sapma_haritasi` HIC hukum basmaz (olculdu: SAF)   -> kanal ALMAZ
  #       `_h12_sapma_hukmu`    F ve N kullanir                   -> ikisini ALIR
  #     Kanal kapisinin olcutu tek: KULLANDIGINI TASI. Kullanilmayani tasitmak da
  #     bir maliyettir — "koruma" adi altinda olculmemis parametre birikir.
  #     SEKIZ hal, YEDI mutant; uc mutant dogrudan kanallari koparir (F/N/O yerine
  #     bos liste), ucu veri kenarlarini (`bl` H10'dan, `ks` H11'den, `en_yeni`
  #     ic kenar), biri kapinin DONUS degerini (H14 o tarihi kullanir — kapilar
  #     arasi kenar).
  #     🔴 `ks` KENARI SONRADAN EKLENDI (olculdu 14 Agu 2026): ilk yedi halin
  #     hicbiri KARAR yazmiyordu, yani `ks` her kosumda BOS geliyordu ve o kenari
  #     koparan mutant yedi halin TAMAMINDA kaciyordu. `h_karar_sapmasi` hali bu
  #     bosluk icin eklendi; izolasyonu `acilis-protokolu` konusu saglar (o blogun
  #     ARKASINDA FRAGMAN YOKTUR, dolayisiyla sapmayi yalnizca karar atesleyebilir).
  #     Kenar VARDI, olcusu YOKTU — ve bunu ancak mutanti yazip kacisini OLCUNCE
  #     gorduk. Beyan degil, olcum.
  #     `continue-on-error` YOK.
  # ---------------------------------------------------------------------------
  h12_kenar_mutanti:
    name: H12 kenar mutanti (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: kenarlar ve uc hukum kanali OLCULUYOR mu
        shell: bash
        run: python faz0/h12_bolme_mutanti.py 2>&1 | tee h12-kenar-cikti.txt
      - name: h12 kenar mutanti ciktisi (artefakt)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h12-kenar-${{ matrix.os }}
          path: h12-kenar-cikti.txt
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 2b-14) OTURUM SAGLIGI OLCERI — `araclar/oturum_sagligi.py` ISIRIYOR mu?
  #     Bu arac urunun parcasi DEGILDIR; oturum yonetimi icindir. Ama o da bir
  #     kapidir ve ayni doktrine tabidir: esik asildiginda hukum DEGISMELI,
  #     olculemeyen hal YESIL SAYILMAMALIDIR. Mutant sentetik transcript uretir
  #     (gercek oturuma bagimli DEGILDIR) ve alti kusuru enjekte eder.
  #     🔴 Aracin KENDISI CI'da kosulmaz: CI runner'inda Claude transcript'i
  #     yoktur, arac dogru davranip OLCULEMEDI/exit 2 dondururdu ve is sahte
  #     kirmizi yanardi. Olculen sey ARACIN SOZLESMESIDIR, ortam degil.
  #     `continue-on-error` YOK.
  # ---------------------------------------------------------------------------
  oturum_sagligi:
    name: oturum sagligi olceri (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: olcerin kendisi isiriyor mu (alti mutant)
        shell: bash
        run: python araclar/oturum_sagligi_mutanti.py 2>&1 | tee saglik-mutant.txt
      - name: saglik mutanti ciktisi (artefakt)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saglik-${{ matrix.os }}
          path: saglik-mutant.txt
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 2c) Y-3 PROBU — kirik boru HUKMU kaybediyor mu, VE HANGI MEKANIZMAYLA?
  #     Iki python surumu BILEREK ayri: run #3/#4'te ayni komut windows py3.11'de
  #     120, py3.13'te 3 dondu — iki AYRI mekanizma. Tek surumle kosmak birini
  #     tumden kor birakir.
  #     `continue-on-error: true` BILINCLI: bu is bir OLCUM, henuz bir kapi degil.
  #     Y-3 tam kapandiginda bayrak kaldirilir ve exit 0 sart kosulur.
  # ---------------------------------------------------------------------------
  boru_probu:
    name: Y-3 probu (${{ matrix.os }} py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: kirik boru hukmu kaybediyor mu?
        continue-on-error: true
        shell: bash
        run: python faz0/boru_probu.py

  # ---------------------------------------------------------------------------
  # 3) ORTAM SINIFI — root olmayan kullanici · dolu disk · salt-okunur
  #     Fable 4. tur §9: "Kor noktan bir dusunce hatasi degil, bir ORTAM eksigi."
  #     Uc YUKSEK bulgunun ucu de (B4-1, B4-3, B4-4) yalniz burada gorunuyor.
  # ---------------------------------------------------------------------------
  ortam:
    name: ortam sinifi (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: B4-1 / B4-3 / B4-4 yeniden uretimi
        continue-on-error: true
        run: sudo bash faz0/ortam_olcum.sh

  # ---------------------------------------------------------------------------
  # 4) KOD KALITESI — calisma-zamani bagimliligi DEGIL, gelistirme bagimliligi.
  #     hafiza.py bunlari import etmez; sifir-bagimlilik felsefesi bozulmaz.
  # ---------------------------------------------------------------------------
  kalite:
    name: ruff / mypy / bandit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff mypy bandit
      - name: ruff — gercek hata sinifi (bugun 30 bulgu)
        continue-on-error: true
        run: ruff check --isolated --select F,E9,B,S,PLE skill/scripts/hafiza.py
      - name: ruff — stil (bugun 345 bulgu, bilgi amacli)
        continue-on-error: true
        run: ruff check --isolated --statistics skill/scripts/hafiza.py
      - name: mypy (bugun 1 hata)
        continue-on-error: true
        run: mypy --ignore-missing-imports skill/scripts/hafiza.py
      - name: bandit (bugun 20 bulgu, hepsi LOW)
        continue-on-error: true
        run: bandit -r skill/scripts/hafiza.py

  # ---------------------------------------------------------------------------
  # 5) CI KAPSAM KAPISI — her bolme mutantinin bir ISI VAR MI?
  #     14 Agu 2026'da olculdu: UC ayri commit bir CI isini MESAJINDA beyan etti,
  #     `.github/workflows/capraz.yml` commit'e girmedi ve kimse fark etmedi.
  #         c0478f0  "CI: h1_kenar_mutanti uc platformda"   -> dosya commit'te YOK
  #         2550eba  CI isi beyan edildi                    -> dosya commit'te YOK
  #         5b1e80f  "CI: h12_kenar_mutanti"                -> dosya commit'te YOK
  #     Uc kez ayni sinif YONTEM kusurudur; "daha dikkatli ol" bir kapi degildir.
  #
  #     MEKANIK: kapi capraz.yml'i CHECKOUT'tan okur. Mutant betigi commit'e girip
  #     workflow girmediginde ESKI workflow kosar, kapi yeni betigi gorur, karsilik
  #     gelen `run:` satirini bulamaz -> KIRMIZI. Yani hatanin kendisi kapiyi
  #     tetikler. Hedef engellemek degil, GIZLENEMEZ KILMAK.
  #
  #     KAPSAM DAR ve bu BILINCLI: yalnizca `faz0/*_bolme_mutanti.py`. Bu ad kalibi
  #     bolme turunun kendisi tarafindan uretilir, dolayisiyla MUAFIYET LISTESI
  #     GEREKMEZ. Muafiyet listesi bir BEYANDIR ve bayatlar. (Olculdu: genis kural
  #     iki muafiyet dogururdu — sabotaj.py, win_yol_probu.py.)
  #
  #     TEK PLATFORM ve bu da bilincli: kapi DEPO METNINI olcer, isletim sistemi
  #     davranisini degil. Ortam farki olcecek bir sey yok. (Ortam farki olan
  #     kapilar uc platformda kosar — bkz. kenar mutantlari.)
  #
  #     IKI ADIM, IKISI DE `continue-on-error` SUZ:
  #       1) kapinin kendisi — bir mutant betigin isi yoksa KIRMIZI
  #       2) kapinin MUTANTI — kapi kor kalirsa KIRMIZI. Kapinin var olmasi
  #          isirdigi anlamina gelmez (doktrin 1). Bu mutant ilk kosumunda
  #          kapinin icinde OLU MANTIK buldu (hukum iki kez hesaplaniyordu).
  # ---------------------------------------------------------------------------
  ci_kapsam:
    name: CI kapsam kapisi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: her bolme mutantinin CI isi VAR mi
        shell: bash
        run: python faz0/ci_kapsam_kapisi.py 2>&1 | tee ci-kapsam-cikti.txt
      - name: kapinin KENDISI isiriyor mu (6 senaryo + 3 kapi mutanti)
        shell: bash
        run: python faz0/ci_kapsam_mutanti.py 2>&1 | tee ci-kapsam-mutant-cikti.txt
      - name: ci kapsam ciktilari (artefakt)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-kapsam-ubuntu-latest
          path: |
            ci-kapsam-cikti.txt
            ci-kapsam-mutant-cikti.txt
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 2b-17) H11 KENAR MUTANTI — SON kapi fonksiyonunun bolmesi olculuyor mu?
  #     14 Agu 2026: `_kapi_h11` DORDE bolundu (CC 23 -> en buyuk parca 10,
  #     48 satir -> 12). Bu, Faz C'nin SON kapi bolmesidir.
  #
  #     🔴 BU BOLMENIN OZELLIGI — SIRA KISITI:
  #     GOVDE kontrolu ("durum: kabul ama govde bos") BAGLANTI dongusunun
  #     ICINDEN cagrilir. Ayri bir donguye alinsaydi `F` listesindeki hukum
  #     sirasi (her ADR icin baglanti+govde) yerine (tum baglantilar, sonra tum
  #     govdeler) olur ve altin kumenin bit-bit esdegerlik kapisi kirilirdi.
  #     Bolme davranisi degistirmez — SIRAYI da degistirmez.
  #
  #     `harita` kenarinin IKI tuketicisi var; ikisi AYRI mutantla koparilir.
  #     Tek mutant kullanilsaydi biri hic olculmemis olabilirdi
  #     (ORTUSEN TESPIT KORLUGU MASKELER — projenin kendi dersi).
  #
  #     ONDORT hal, DOKUZ mutant. Her hal TEK hukmu atesler (14/14 ayrik imza):
  #     H11'in on bir fail() cagrisinin her biri kendi haline sahip.
  #
  #     🔴 OLCULDU: ALTIN KUME DOKUZ MUTANTIN DOKUZUNA DA KOR (9/9).
  #     Bagimsiz ikinci olcum ayni seyi soyluyor: kapsam envanterinde H11
  #     1 KAPSAMLI / 10 KAPSAMSIZ. Yani bu is H11 icin TEK olcumdur; ortusen
  #     yedegi YOKTUR ve `continue-on-error` kesinlikle YOK.
  # ---------------------------------------------------------------------------
  h11_kenar_mutanti:
    name: H11 kenar mutanti (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: kenarlar ve hukum kanallari OLCULUYOR mu
        shell: bash
        run: python faz0/h11_bolme_mutanti.py 2>&1 | tee h11-kenar-cikti.txt
      - name: h11 kenar mutanti ciktisi (artefakt)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h11-kenar-${{ matrix.os }}
          path: h11-kenar-cikti.txt
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 6) ETKI IMZASI HARNESS'I — ETKILI komutlar icin gozlem yuzeyi
  #     Kapi mutantlarinin yuzeyi `(exit, stdout)`tir ve salt-okunur `kapi` icin
  #     dogrudur. `cmd_kur`/`cmd_derle`/`cmd_devral` ETKILIDIR: dosya yazar,
  #     kilit alir, zincire halka atar. Kopan bir kenar AYNI stdout'u basip
  #     DISKTE FARKLI AGAC birakabilir. Kapi kalibini oldugu gibi kopyalamak
  #     KOR bir kapi uretmek olurdu.
  #
  #     Bu is, harness'in MASRAFINI HAK ETTIGINI olcer. Her sessiz-yazim mutanti
  #     icin IKI yuzey birden hesaplanir: (exit, stdout) ve (exit, stdout, disk
  #     agaci imzasi). "ESKI KOR · YENI ISIRDI" cikan mutant sayisi SIFIRSA is
  #     KIRMIZI yanar — yani harness'in degeri beyan edilmez, her kosumda
  #     yeniden OLCULUR.
  #
  #     🔴 BILINEN KOR NOKTA, GIZLENMIYOR: `halka`/`onceki` alanlari ZAMANDAN
  #     tureyen hash'lerdir ve normalize edilir; yalnizca onlari bozan bir kusur
  #     bu yuzeye gorunmez. `S-5` mutanti tam olarak bunu yapar ve raporda
  #     "IKISI DE KOR" satiri olarak DURUR. Hedef engellemek degil, gizlenemez
  #     kilmak.
  #
  #     UC PLATFORM: imza dosya sistemine dokunur (yol ayirici, buyuk/kucuk harf,
  #     sembolik baglanti). Bu, ORTAM farki olan bir olcumdur — tek platform yetmez.
  #     `continue-on-error` YOK.
  # ---------------------------------------------------------------------------
  cmd_etki_mutanti:
    name: Etki imzasi harness mutanti (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: yeni yuzey masrafini HAK EDIYOR mu
        shell: bash
        run: python faz0/cmd_etki_mutanti.py 2>&1 | tee etki-harness-cikti.txt
      - name: etki harness ciktisi (artefakt)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etki-harness-${{ matrix.os }}
          path: etki-harness-cikti.txt
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 7) cmd_kur BOLME MUTANTI — cmd_* sinifinin ILK bolmesi
  #     Kapi bolmelerinden tek farki GOZLEM YUZEYI ve fark her seyi belirliyor:
  #       kapi bolmeleri : (exit, stdout)
  #       cmd_* bolmeleri: (exit, stdout, DISK AGACI MANIFESTOSU)
  #     Olculdu (14 Agu 2026): `M-3 KENAR rc->dizinler` ve `M-4 KENAR ad->dosyalar`
  #     mutantlari `(exit, stdout)` yuzeyine GORUNMEZ. Kapi kalibi oldugu gibi
  #     kopyalansaydi bu iki kenar KOR kalirdi — ve kimse bilmezdi.
  #
  #     ON HAL, SEKIZ MUTANT. Haller `cmd_kur`un ayri dallarini calistirir; alti
  #     tanesi bir `oldur` yolu, cunku SURECI HANGI PARCANIN oldurdugu ETKI
  #     KAPISI'nin ana eksenidir.
  #
  #     🔴 `h_goreli_kok` SONRADAN eklendi: `M-8 DONUS kok` dokuz halin tamaminda
  #     KACIYORDU. Korluk ilan etmeden once "esdeger mutant mi?" diye soruldu —
  #     EVET idi: dokuz halin dokuzu da `--kok`u MUTLAK veriyordu, `abspath` bir
  #     islem yapmiyordu. Kacis kapinin degil GIRDI KUMESININ eksigiydi.
  #
  #     ⚠️ ESDEGERLIK BU ISTE OLCULMEZ ve bu bilincli. Esdegerlik `--once` ile
  #     BOLME ONCESI motoru ister; onu depoda tutmak "motorun ikinci kopyasi
  #     olmaz" kuralini kirardi. Esdegerlik bir GECIS kapisidir, surekli degil:
  #     bir kez olculdu (on halin ucusu de FARK YOK) ve kaniti
  #     `faz0/FAZC_CMD_KUR_RAPOR.md` icinde durur. Bu is KENARLARI olcer.
  #     `continue-on-error` YOK.
  # ---------------------------------------------------------------------------
  cmd_kur_bolme_mutanti:
    name: cmd_kur bolme mutanti (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: yedi parca arasi kenarlar OLCULUYOR mu
        shell: bash
        run: python faz0/cmd_kur_bolme_mutanti.py 2>&1 | tee cmd-kur-kenar-cikti.txt
      - name: cmd_kur kenar mutanti ciktisi (artefakt)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmd-kur-kenar-${{ matrix.os }}
          path: cmd-kur-kenar-cikti.txt
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 5b) YOL AYRACI KAPISI — cikti ayraci PLATFORMA BAGLI mi?
  #     14 Agu 2026, GERCEK Windows kosumunda olculdu: `devral`
  #         YEDEK: arsiv\hafiza\v2\_DEVIR_ONCESI_2026-08-14.md
  #     basti; AYNI ciktinin H4 satirlari duz bolu basiyordu. Tek ciktida
  #     KARISIK ayrac. Kok neden: `os.path.relpath` 22 kez cagriliyordu ve
  #     cevirim her cagri yerinde ELLE tekrarlanmisti — 18'i kosulsuz (D-1
  #     karari'ni ihlal ederek), 4'u hic. Kusur degil, KACAK URETICISI.
  #
  #     BUNU OLCEN SIFIR KAPI VARDI: `faz0/altin_cikti.py`nin OLCUM_KOMUTLARI'si
  #     yalniz ["kapi"] ve ["kapi","--siki"]. `not` · `devral` · `bloklastir`
  #     ciktisi altin kumenin TAMAMEN DISINDA. Ortusen korluk degil, TAM KORLUK.
  #
  #     ARAC IKI KAPI TASIR ve biri otekinin yerine GECMEZ:
  #       KAPI-1 YAPI     : depo metninde ciplak `os.path.relpath` yalniz
  #                         `kok_goreli` ve `_rel` govdelerinde. MUAFIYET LISTESI
  #                         YOK — kural fonksiyon ADIYLA tanimli, bayatlayamaz.
  #       KAPI-2 DAVRANIS : `_rel` birim olarak olculur (ntpath/posixpath ile).
  #                         H-a cevirir · H-b POSIX'te '\' KORUR (D-1) · H-c cokmez.
  #     UC MUTANT, UC AYRI EKSEN: M-1->KAPI-1 · M-2->H-a · M-3->H-b. Bir mutant
  #     IKI kapiyi birden ateslerse arac "ORTUSTU" deyip KIRMIZI yanar; boylece
  #     ortusen tespit korlugu mutantin kendisinde de olculur.
  #     Kapinin gercekten olctugu ESKI motorla kanitlandi: dffe3ce6... -> 21 kacak.
  #
  #     UC PLATFORM ve `continue-on-error` YOK. KAPI-2 simulasyon kullanir ama
  #     arac gercek runner'da kosar; simulasyon CI'nin YERINE GECMEZ.
  #     NOT: `| tee` exit kodunu YUTMAZ — GitHub `shell: bash`i `-eo pipefail`
  #     ile kosar. Bu satiri "sadeleştirip" pipefail'i dusuren kapiyi kor birakir.
  # ---------------------------------------------------------------------------
  yol_ayraci_kapisi:
    name: yol ayraci kapisi (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: iki kapi + uc mutant
        shell: bash
        run: python faz0/yol_ayraci_kapisi.py 2>&1 | tee yol-ayraci-cikti.txt
      - name: yol ayraci ciktisi (artefakt)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yol-ayraci-${{ matrix.os }}
          path: yol-ayraci-cikti.txt
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # WINDOWS DALI MUTANTI — BITTI maddesi 2(i).
  #     Motorda `sys.platform == "win32"` YALNIZ IKI yerde gecer ve 14 Agu 2026'ya
  #     kadar ikisi de HICBIR mutantla olculmuyordu. Ortak bataryanin uc platformda
  #     kosuyor olmasi bunu KAPATMAZ: batarya platformdan BAGIMSIZ davranisi gorur.
  #     DAL A `_surec_yasiyor` -> `_surec_yasiyor_win` (Y-1) · DAL B `_boru_koptu_mu` (Y-3).
  #
  #     UC KAPI: KAPI-1 ENVANTER (listelenmemis platform dali) · KAPI-2 DAVRANIS
  #     (H-a yonlendirme · H-b ayrim · H-c boru; simulasyon) · KAPI-3 CANLI (GERCEK
  #     ctypes + gercek pid, YALNIZ windows-latest'te hukum verir; ubuntu/macos'ta
  #     "OLCULEMEDI" der ve YESIL DEMEZ — bu isin windows kolu KAPI-3'un TEK evidir).
  #
  #     DORT MUTANT, DORT AYRI EKSEN: M-1->KAPI-1 · M-2->H-a · M-3->H-b · M-4->H-c.
  #     Bir mutant IKI hukmu birden ateslerse arac "ORTUSTU" deyip KIRMIZI yanar.
  #     Ayrica windows'ta M-3 KAPI-3'u de kirmizi yakmali; bu ortusme DEGIL, canli
  #     kapinin KOR OLMADIGININ olcumudur ve ayri raporlanir.
  #
  #     UC PLATFORM ve `continue-on-error` YOK. `| tee` exit kodunu YUTMAZ
  #     (`shell: bash` -eo pipefail ile kosar); bu satiri sadelestirmek kapiyi kor birakir.
  # ---------------------------------------------------------------------------
  win_dal_mutanti:
    name: win dal mutanti (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: uc kapi + dort mutant
        shell: bash
        run: python faz0/win_dal_mutanti.py 2>&1 | tee win-dal-cikti.txt
      - name: win dal ciktisi (artefakt)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: win-dal-${{ matrix.os }}
          path: win-dal-cikti.txt
          if-no-files-found: warn
